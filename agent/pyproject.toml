[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resta-agent"
version = "1.0.0"
description = "Resta cell agent: provisioning, backups, updates and metrics for Odoo 19 servers"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "psutil>=5.9", "httpx>=0.27"]

[project.scripts]
resta-agent = "resta_agent.cli:main"

[tool.setuptools]
packages = ["resta_agent"]

[tool.setuptools.package-data]
resta_agent = ["templates/*"]
