# كل مطعم: <القاعدة>.{{BASE_DOMAIN}}  ←  طبقة أودو المناسبة (routes.map)
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $resta_sub {
    "~^(?<sub>[a-z0-9][a-z0-9_-]*)\.{{BASE_DOMAIN}}$" $sub;
    default "";
}
map $resta_sub $resta_stack {
    default main;
    include /etc/nginx/resta/routes.map;
}
map $resta_sub $resta_suspended {
    default 0;
    include /etc/nginx/resta/suspended.map;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($resta_sub = "") { return 444; }

    client_max_body_size 256m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 10s;
    gzip on;
    gzip_types text/css text/plain application/json application/javascript text/xml image/svg+xml;

    error_page 503 /resta-suspended.html;
    location = /resta-suspended.html {
        root /etc/nginx/resta;
        internal;
    }

    location /websocket {
        if ($resta_suspended) { return 503; }
        proxy_pass http://odoo-$resta_stack:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }

    location / {
        if ($resta_suspended) { return 503; }
        proxy_pass http://odoo-$resta_stack:8069;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
    }
}
