# منصة ريستا (سيرفر التحكم)
name: resta-platform
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  odoo:
    # صورة ريستا نفسها (Dockerfile في جذر المستودع)، مع إعدادات المنصة بدل مدخل السيرفر الواحد
    build: ./src
    image: resta/odoo:19
    entrypoint: ["/usr/bin/env"]
    command: ["odoo", "-c", "/etc/odoo/platform.conf"]
    restart: unless-stopped
    depends_on: [db]
    # 8069 مفتوح للشبكة الداخلية فقط (الجدار الناري يسمح للسيرفرات ذات الوسم resta-cell)
    ports:
      - "8069:8069"
    volumes:
      - ./odoo.conf:/etc/odoo/platform.conf:ro
      - ./data/odoo:/var/lib/odoo
  nginx:
    image: nginx:stable
    restart: unless-stopped
    depends_on: [odoo]
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
